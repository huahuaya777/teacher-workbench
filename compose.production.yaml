# 待验证的正式环境草案。先完成 docs/production-readiness.md 的闸门；不得直接 up。
# 使用独立项目名、卷和回环端口，不读取测试栈 .env 或卷。
name: teacher-workbench-production
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - production_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?} -d ${DB_NAME:?}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - production_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    env_file: .env.production
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      PRIVATE_FILE_ROOT: /app/data/private
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_TRUST_PROXY_SSL_HEADER: "1"
      AI_ENABLED: "0"
      AI_API_KEY: ""
      AI_LOCAL_QUEUE: "0"
    volumes:
      - production_private:/app/data/private
      - production_static:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["sh", "-c", "python scripts/check_production_env.py --process-env && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"]
  worker:
    build: .
    env_file: .env.production
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      PRIVATE_FILE_ROOT: /app/data/private
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_TRUST_PROXY_SSL_HEADER: "1"
      AI_ENABLED: "0"
      AI_API_KEY: ""
      AI_LOCAL_QUEUE: "0"
    volumes:
      - production_private:/app/data/private
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["sh", "-c", "python scripts/check_production_env.py --process-env && python manage.py runworker"]
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./config/nginx-production.conf:/etc/nginx/conf.d/default.conf:ro
      - production_static:/usr/share/nginx/html/static:ro
    depends_on:
      - web
volumes:
  production_db:
  production_redis:
  production_private:
  production_static:
